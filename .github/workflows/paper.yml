name: Dual XGBoost paper accounts
on:
  push:
    paths: ['src/**', 'tests/**', 'config.json', 'requirements.txt', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      mode:
        description: 'prepare / open / close / probe'
        default: prepare
        type: choice
        options: [prepare, open, close, probe]
  schedule:
    # UTC: runner is started early and waits for the actual Shanghai window.
    - cron: '17 0 * * 1-5'
    - cron: '12,22,32 1 * * 1-5'
    - cron: '47 4 * * 1-5'
    - cron: '25,40 6 * * 1-5'
    - cron: '20 10,14 * * 1-5'
    - cron: '10 22 * * 0-4'
permissions:
  contents: write
concurrency:
  group: dual-paper-ledger
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache/restore@v4
        id: daily
        with:
          path: data
          key: public-daily-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: public-daily-v1-
      - run: pip install -r requirements.txt
      - name: Validate core invariants
        run: python -m unittest discover -s tests -v
      - name: Select operation
        id: operation
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          event = os.environ['EVENT']
          schedule = os.environ.get('SCHEDULE','')
          mode = os.environ.get('INPUT') or 'prepare'
          if event == 'schedule':
              hour = schedule.split()[1]
              mode = 'open' if hour in ('0', '1') else 'close' if hour in ('4', '6') else 'prepare'
          local_now = datetime.now(ZoneInfo('Asia/Shanghai'))
          if event == 'push' and local_now.date().isoformat() == '2026-10-29' and local_now.hour < 9:
              mode = 'open'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('mode='+mode+'\n')
          PY
      - name: Initialize independent accounts
        run: python -m src.app init
      - name: Probe public five-level quote schema
        if: steps.operation.outputs.mode == 'prepare' || steps.operation.outputs.mode == 'probe'
        run: python -m src.app probe
      - name: Run operation
        run: python -m src.app ${{ steps.operation.outputs.mode }}
      - uses: actions/cache/save@v4
        if: always() && steps.operation.outputs.mode == 'prepare'
        with:
          path: data
          key: public-daily-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Persist ledger, model and audit even on failure
        if: always()
        run: |
          git config user.name 'xgboost-paper-bot'
          git config user.email 'xgboost-paper-bot@users.noreply.github.com'
          git add -A state reports
          if [ -d models ]; then git add -A models; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update paper ledger, model and data audit [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-audit-${{ github.run_id }}
          path: |
            reports
            state
          retention-days: 30
